name: Build Android app (Play Store AAB)

# Builds the Qindiaglobal Android app. It does not touch the website or the server.
# Run it from the Actions tab: "Build Android app (Play Store AAB)" -> "Run workflow".
on:
  workflow_dispatch:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android-aab.yml']

permissions:
  contents: write  # only used to save an UNSIGNED build to the android-unsigned-build branch

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      QI_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      QI_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      QI_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
      QI_VERSION_CODE: ${{ github.run_number }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.14.3'

      - name: Use the upload key (if the secrets are set)
        run: |
          if [ -n "$KEYSTORE_B64" ] && [ -n "$QI_KEYSTORE_PASSWORD" ]; then
            printf '%s' "$KEYSTORE_B64" | tr -d ' \r\n' | base64 --decode > "$RUNNER_TEMP/upload.p12"
            echo "QI_KEYSTORE_PATH=$RUNNER_TEMP/upload.p12" >> "$GITHUB_ENV"
            echo "SIGNED=yes" >> "$GITHUB_ENV"
            echo "Upload key found: the AAB will be signed and ready for Play Console."
          else
            echo "SIGNED=no" >> "$GITHUB_ENV"
            echo "::warning::No upload key secrets yet, so this AAB is UNSIGNED and Play Console will refuse it. Add ANDROID_KEYSTORE_BASE64 and ANDROID_KEYSTORE_PASSWORD."
          fi

      - name: Build AAB (for Play Store) and APK (to test on a phone)
        run: gradle -p android bundleRelease assembleRelease --no-daemon --stacktrace

      - name: Check the signature
        if: env.SIGNED == 'yes'
        run: |
          jarsigner -verify android/app/build/outputs/bundle/release/app-release.aab | tail -1
          keytool -printcert -jarfile android/app/build/outputs/bundle/release/app-release.aab | grep -E 'SHA256|Owner' | head -2

      - name: Name the files
        run: |
          mkdir out
          V="1.0.${{ github.run_number }}"
          if [ "$SIGNED" = yes ]; then
            cp android/app/build/outputs/bundle/release/app-release.aab "out/qindiaglobal-$V-playstore.aab"
            cp android/app/build/outputs/apk/release/app-release.apk "out/qindiaglobal-$V-test-phone.apk"
          else
            cp android/app/build/outputs/bundle/release/app-release.aab "out/qindiaglobal-$V-UNSIGNED.aab"
            # Unsigned phone APK plus Google's apksigner/zipalign, so the APK can be signed offline too.
            cp android/app/build/outputs/apk/release/app-release-unsigned.apk "out/qindiaglobal-$V-UNSIGNED.apk"
            BT=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -1)
            mkdir -p out/tools && cp "$BT/lib/apksigner.jar" "$BT/zipalign" out/tools/
          fi
          ls -l out

      # Until the upload-key secrets exist, keep a copy of the unsigned AAB on a side branch so it
      # can be signed offline with the private key (the key never comes to GitHub this way).
      - name: Save unsigned build to the android-unsigned-build branch
        if: env.SIGNED == 'no'
        run: |
          cd out
          git init -q -b android-unsigned-build
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add . && git commit -qm "Unsigned Android build ${{ github.run_number }} from ${{ github.sha }}"
          git push -f "https://x-access-token:${{ github.token }}@github.com/${{ github.repository }}.git" android-unsigned-build

      - uses: actions/upload-artifact@v4
        with:
          name: qindiaglobal-android-${{ env.SIGNED == 'yes' && 'signed' || 'unsigned' }}-${{ github.run_number }}
          path: out/*
          if-no-files-found: error
          retention-days: 30
