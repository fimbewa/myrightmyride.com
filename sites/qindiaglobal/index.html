<body>
<header class="bar">
  <div class="wrap bar-in">
    <a class="brand" href="/" aria-label="Qindiaglobal home"><b>Q</b>india<span>global</span></a>
    <select id="lang" aria-label="Language"></select>
  </div>
  <nav class="wrap nav">
    <a href="#pledge" data-t="nav_pledge"></a><a href="#habits" data-t="nav_habits"></a><a href="#photos" data-t="nav_photos"></a><a href="#posters" data-t="nav_posters"></a><a href="#join" data-t="nav_join"></a>
  </nav>
</header>

<main>
  <section class="hero">
    <div class="wrap">
      <div class="queue" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i><i></i></div>
      <h1 data-t="h1"></h1>
      <p class="lead" data-t="lead"></p>
      <div class="ctas">
        <a class="btn" href="#pledge" data-t="cta_pledge"></a>
        <a class="btn ghost" href="#share" data-t="cta_share"></a>
      </div>
      <p class="hero-disc" data-t="disc"></p>
      <div class="counter" id="counter" hidden>
        <strong id="count">0</strong>
        <span data-t="count_label"></span>
      </div>
    </div>
  </section>

  <section id="habits" class="wrap block">
    <h2 data-t="rulesH"></h2>
    <ol class="habits">
      <li><span data-t="r1"></span></li><li><span data-t="r2"></span></li><li><span data-t="r3"></span></li><li><span data-t="r4"></span></li><li><span data-t="r5"></span></li>
    </ol>
    <h2 data-t="placesH"></h2>
    <div class="places"><span data-t="p1"></span><span data-t="p2"></span><span data-t="p3"></span><span data-t="p4"></span><span data-t="p5"></span><span data-t="p6"></span><span data-t="p7"></span></div>
  </section>

  <section id="photos" class="wrap block">
    <h2 data-t="photosH"></h2>
    <p data-t="photosLead"></p>
    <h3 class="ph-h crowd" data-t="crowdH"></h3>
    <div class="gallery" id="galCrowd"></div>
    <h3 class="ph-h queue-h" data-t="queueH"></h3>
    <div class="gallery" id="galQueue"></div>
    <p class="ctas"><a class="btn" href="#pledge" data-t="cta_pledge"></a></p>
  </section>

  <section id="pledge" class="wrap block card">
    <h2 data-t="pledgeH"></h2>
    <blockquote class="pledge" data-t="pledgeText"></blockquote>
    <form id="pledgeForm" novalidate>
      <input name="name" maxlength="60" autocomplete="name" data-ph="f_name">
      <div class="row">
        <input name="city" maxlength="60" required autocomplete="address-level2" data-ph="f_city">
        <input name="country" maxlength="60" autocomplete="country-name" data-ph="f_country">
      </div>
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn" type="submit" data-t="pledge_btn"></button>
      <p class="msg" id="pledgeMsg" role="status"></p>
    </form>
    <p class="recent" id="recent" hidden><b data-t="recent"></b> <span id="recentList"></span></p>
  </section>

  <section id="share" class="wrap block">
    <h2 data-t="shareH"></h2>
    <p data-t="shareLead"></p>
    <div class="share">
      <a id="sWa" class="sbtn wa" target="_blank" rel="noopener">WhatsApp</a>
      <a id="sX" class="sbtn x" target="_blank" rel="noopener">X</a>
      <a id="sFb" class="sbtn fb" target="_blank" rel="noopener">Facebook</a>
      <a id="sTg" class="sbtn tg" target="_blank" rel="noopener">Telegram</a>
      <button id="sCopy" class="sbtn" type="button" data-t="copy_btn"></button>
      <button id="sMore" class="sbtn" type="button" data-t="more_btn" hidden></button>
    </div>
  </section>

  <section id="posters" class="wrap block">
    <h2 data-t="postersH"></h2>
    <p data-t="postersLead"></p>
    <div class="posters">
      <a class="poster-card" id="pHabits" target="_blank" rel="noopener">
        <div class="mini habits-mini"><b>Q</b><i></i><i></i><i></i><i></i><i></i></div>
        <strong data-t="poster1"></strong><span data-t="open_poster"></span>
      </a>
      <a class="poster-card" id="pSign" target="_blank" rel="noopener">
        <div class="mini sign-mini"><span class="queue" aria-hidden="true"><i></i><i></i><i></i><i></i></span></div>
        <strong data-t="poster2"></strong><span data-t="open_poster"></span>
      </a>
    </div>
  </section>

  <section id="join" class="wrap block card">
    <h2 data-t="joinH"></h2>
    <p data-t="joinLead"></p>
    <form id="joinForm" novalidate>
      <label><span data-t="f_kind"></span>
        <select name="kind">
          <option value="volunteer" data-t="k_volunteer"></option>
          <option value="idea" data-t="k_idea"></option>
          <option value="partner" data-t="k_partner"></option>
          <option value="other" data-t="k_other"></option>
        </select>
      </label>
      <div class="row">
        <input name="name" maxlength="80" autocomplete="name" data-ph="f_name">
        <input name="city" maxlength="60" autocomplete="address-level2" data-ph="f_city">
      </div>
      <input name="contact" maxlength="120" autocomplete="email" data-ph="f_contact">
      <textarea name="message" rows="4" maxlength="2000" required data-ph="f_msg"></textarea>
      <input name="website" class="hp" tabindex="-1" autocomplete="off" aria-hidden="true">
      <button class="btn" type="submit" data-t="send_btn"></button>
      <p class="msg" id="joinMsg" role="status"></p>
    </form>
  </section>
</main>

<footer class="foot">
  <div class="wrap">
    <p class="disc"><b data-t="discH"></b> <span data-t="disc"></span></p>
    <p><b data-t="privacyH"></b> <span data-t="privacy"></span></p>
    <p class="small"><span data-t="tagline"></span> © <span id="year"></span> qindiaglobal.com</p>
  </div>
</footer>
