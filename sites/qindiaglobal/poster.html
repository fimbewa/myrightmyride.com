<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Qindiaglobal poster</title>
<meta name="robots" content="noindex">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<style>
:root{--ink:#14213d;--muted:#5c6474;--accent:#e85d04;--deep:#1d3557;--line:#dfe3ec}
*{box-sizing:border-box}
body{margin:0;overflow-x:hidden;background:#e9ecf2;color:var(--ink);font-family:system-ui,-apple-system,"Segoe UI",Roboto,"Noto Sans","Noto Sans Devanagari","Noto Sans Gujarati","Noto Sans Bengali","Noto Sans Tamil","Noto Sans Telugu","Noto Sans Arabic",sans-serif}
.tools{display:flex;flex-wrap:wrap;gap:8px;justify-content:center;padding:12px 16px}
.tools button,.tools a,.tools select{font:inherit;font-weight:700;border-radius:999px;padding:10px 18px;border:0;background:var(--accent);color:#fff;text-decoration:none;cursor:pointer}
.tools a,.tools select{background:#fff;color:var(--deep);border:1px solid var(--line)}
.page{width:210mm;height:297mm;margin:0 0 24px;background:#fff;box-shadow:0 4px 24px rgba(0,0,0,.12);padding:16mm 15mm 12mm;display:flex;flex-direction:column;overflow:hidden}
.fit{transform-origin:top left;width:210mm}
.brand{font-weight:800;font-size:15mm;letter-spacing:-.5px;text-align:center;line-height:1}
.brand b{color:var(--accent)}.brand span{color:var(--muted);font-weight:600}
.queue{display:flex;justify-content:center;align-items:flex-end;gap:3mm;margin:7mm 0 5mm}
.queue i{display:block;width:8mm;border-radius:4mm 4mm 1mm 1mm;background:var(--deep)}
.queue i:nth-child(1){height:22mm;background:var(--accent)}.queue i:nth-child(2){height:18mm}.queue i:nth-child(3){height:23mm}.queue i:nth-child(4){height:17mm}.queue i:nth-child(5){height:21mm}
h1{margin:0 0 7mm;text-align:center;color:var(--deep);font-size:13mm;line-height:1.15}
ol{list-style:none;counter-reset:h;margin:4mm 0 0;padding:0;display:grid;gap:8mm;font-size:7.6mm;line-height:1.35}
ol li{counter-increment:h;display:flex;gap:5mm;align-items:flex-start}
ol li::before{content:counter(h);flex:none;width:12mm;height:12mm;border-radius:50%;background:var(--accent);color:#fff;font-weight:800;display:grid;place-items:center;font-size:6mm}
.bottom{margin-top:auto;display:flex;gap:6mm;align-items:center;border-top:1mm solid var(--deep);padding-top:6mm}
.bottom img{width:30mm;height:30mm;flex:none}
.bottom .site{font-size:7mm;font-weight:800;color:var(--deep)}
.bottom p{margin:1.5mm 0 0;font-size:3.4mm;color:var(--muted);line-height:1.35}
/* sign */
.sign{background:var(--accent);color:#fff;justify-content:center;text-align:center}
.sign .queue i{background:#fff}.sign .queue i:nth-child(1){background:var(--deep)}
.sign .queue{margin:0 0 12mm;gap:5mm}.sign .queue i{width:14mm}
.sign .queue i:nth-child(1){height:40mm}.sign .queue i:nth-child(2){height:33mm}.sign .queue i:nth-child(3){height:42mm}.sign .queue i:nth-child(4){height:31mm}.sign .queue i:nth-child(5){height:38mm}
.sign .big{font-size:22mm;font-weight:800;line-height:1.1;margin:0 0 10mm}
.sign .sub{font-size:9mm;font-weight:600;margin:0}
.sign .arrow{font-size:40mm;line-height:1;margin:10mm 0 0}
.sign .bottom{border-color:#fff;text-align:start}
.sign .bottom .site{color:#fff}.sign .bottom p{color:#fff;opacity:.92}
.sign .bottom img{background:#fff;border-radius:2mm;padding:1.5mm}
[dir=rtl] .sign .arrow{transform:scaleX(-1)}
@page{size:A4;margin:0}
@media print{body{background:#fff}.tools{display:none}.page{margin:0;box-shadow:none}.fit{transform:none!important;height:auto!important;margin:0!important}}
</style>
</head>
<body>
<div class="tools">
  <button id="print" type="button" data-t="poster_print"></button>
  <select id="lang" aria-label="Language"></select>
  <a href="/" id="back" data-t="poster_back"></a>
</div>
<div class="fit" id="fit"></div>

<template id="habits">
  <div class="page">
    <div class="brand"><b>Q</b>india<span>global</span></div>
    <div class="queue" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <h1 data-t="h1"></h1>
    <ol><li data-t="r1"></li><li data-t="r2"></li><li data-t="r3"></li><li data-t="r4"></li><li data-t="r5"></li></ol>
    <div class="bottom">
      <img src="/qr.svg" alt="QR code: qindiaglobal.com">
      <div><div class="site">qindiaglobal.com</div><p data-t="tagline"></p><p data-t="disc"></p></div>
    </div>
  </div>
</template>
<template id="sign">
  <div class="page sign">
    <div class="queue" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></div>
    <p class="big" data-t="sign_text"></p>
    <p class="sub" data-t="sign_sub"></p>
    <div class="arrow" aria-hidden="true">→</div>
    <div class="bottom">
      <img src="/qr.svg" alt="QR code: qindiaglobal.com">
      <div><div class="site">qindiaglobal.com</div><p data-t="tagline"></p><p data-t="disc"></p></div>
    </div>
  </div>
</template>

<script src="/i18n.js"></script>
<script>
const q = new URLSearchParams(location.search);
const type = q.get("type") === "sign" ? "sign" : "habits";
const fit = document.getElementById("fit"), sel = document.getElementById("lang");
fit.append(document.getElementById(type).content.cloneNode(true));
QI_LANGS.forEach(([c, n]) => sel.add(new Option(n, c)));
function setLang(l) {
  sel.value = l;
  const t = QI_apply(l);
  document.title = "Qindiaglobal · " + t(type === "sign" ? "poster2" : "poster1");
  document.getElementById("back").href = "/?lang=" + l;
  history.replaceState(null, "", "?type=" + type + "&lang=" + l);
}
sel.onchange = () => setLang(sel.value);
setLang(QI_pick());
document.getElementById("print").onclick = () => window.print();
// Shrink the A4 page to fit a phone screen (printing always uses full A4 size).
function scale() {
  const page = fit.querySelector(".page"), w = page.offsetWidth, s = Math.min(1, (document.documentElement.clientWidth - 16) / w);
  fit.style.transform = "scale(" + s + ")";
  fit.style.marginLeft = Math.max(0, (document.documentElement.clientWidth - w * s) / 2) + "px";
  fit.style.height = page.offsetHeight * s + 24 + "px";
}
addEventListener("resize", scale); scale();
</script>
</body>
</html>
