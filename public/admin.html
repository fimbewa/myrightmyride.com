<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex">
<title>Owner panel · myrightmyride.com</title>
<link rel="stylesheet" href="/css/app.css">
<style>
  .tabs{display:flex;gap:6px;flex-wrap:wrap}
  table{width:100%;border-collapse:collapse;font-size:13px}
  th,td{text-align:left;padding:7px 6px;border-bottom:1px solid var(--line);vertical-align:top}
  th{color:var(--muted);font-weight:600;font-size:12px;white-space:nowrap}
  td{min-width:70px}
  .scroll{overflow-x:auto}
  .stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(130px,1fr));gap:8px}
  .stat{border:1px solid var(--line);border-radius:12px;padding:10px;background:var(--bg)}
  .stat b{display:block;font-family:var(--display);font-size:24px}
  .on{color:var(--ok);font-weight:700} .off{color:var(--muted)}
  textarea{min-height:80px;resize:vertical}
  .ed{display:grid;grid-template-columns:1fr 2fr auto;gap:6px;align-items:center}
  .ed.ins{grid-template-columns:1fr 1.4fr 2fr auto}
  @media (max-width:520px){.ed,.ed.ins{grid-template-columns:1fr}}
  .wrap{max-width:1000px}
</style>
</head>
<body>
<div class="wrap">
  <header class="top">
    <div><div class="brand">myrightmyride<span>.com</span></div><div class="tag">Owner panel</div></div>
    <button class="btn sec small" id="logout" hidden>Log out</button>
  </header>
  <section class="card" id="loginCard">
    <h2>Owner login</h2>
    <p class="note">Use the admin password set in the server's <span class="mono">.env</span> file.</p>
    <form id="loginForm" class="row">
      <input type="password" id="pw" placeholder="Admin password" autocomplete="current-password" style="flex:1;min-width:200px">
      <button class="btn">Log in</button>
    </form>
    <div class="err" id="loginErr"></div>
  </section>
  <nav class="tabs" id="tabs" hidden>
    <button class="chip" data-t="overview" aria-pressed="true">Overview</button>
    <button class="chip" data-t="users" aria-pressed="false">Users &amp; logins</button>
    <button class="chip" data-t="drivers" aria-pressed="false">Drivers</button>
    <button class="chip" data-t="rides" aria-pressed="false">Rides</button>
    <button class="chip" data-t="complaints" aria-pressed="false">Complaints</button>
    <button class="chip" data-t="texts" aria-pressed="false">Website texts</button>
    <button class="chip" data-t="options" aria-pressed="false">Vehicles, insurance &amp; maps</button>
    <button class="chip" data-t="places" aria-pressed="false">Places</button>
  </nav>
  <section class="card" id="view" hidden></section>
  <p class="note"><a href="/">← Back to the website</a></p>
</div>
<script src="/js/admin.js"></script>
</body>
</html>
